name: Publish to itch.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish to itch.io
        uses: robpc/itchio-upload-action@v1
        with:
          api-key: ${{ secrets.ITCH_IO_API_KEY }}
          path: pathToBuild/
          project: dev-ananta/hack-to-the-past
          channel: windows-x64
